// 튜토리얼: D.TUTORIAL 7단계. 실제 행동(통계)으로 진행되며 서버에 단계가 저장된다.
const TUT_SEL = { pet: ['#scene', 'center'], hatch: ['[data-tab="clouds"]'], team: ['[data-tower]'], tower1: ['[data-tower]'], levelup: ['[data-tab="clouds"]'], tower3: ['[data-tower]'], explore: ['[data-tab="explore"]'] };
const COACH = [null, ...D.TUTORIAL.map((t, i) => ({ sel: TUT_SEL[t.key][0], pos: TUT_SEL[t.key][1], text: `<small>${i + 1}/${D.TUTORIAL.length}</small> ${t.text}`, done: (s) => R.statValue(s, t.stat) >= (t.goal || 1) }))];
// 오늘의 추천: 지금 하면 좋은 행동 하나
function recommend(s, now) {
  const m = s.missions;
  const ready = m.keys.filter((k) => !m.claimed.includes(k) && (m.prog[k] || 0) >= D.DAILY_POOL[k].goal).length + D.ACHIEVEMENTS.filter((a) => !s.ach.includes(a.id) && R.statValue(s, a.stat) >= a.goal).length;
  if (s.login.day !== R.dayKey(now)) return ['missions', '출석 보상 받기', 'mission'];
  if (ready) return ['missions', `보상 ${ready}개 모두 받기`, 'mission'];
  if (s.exp.some((e) => e && e.endAt <= now)) return ['explore', '열기구가 돌아왔어요', 'balloon'];
  if (s.wallet.seed >= D.HATCH_MULTI) return ['clouds', `구름씨 ${D.HATCH_MULTI}회 부화`, 'seed'];
  if (s.wallet.seed > 0) return ['clouds', '구름씨 부화하기', 'seed'];
  if (Object.entries(s.clouds).some(([, c]) => { const q = D.EVOLVE_REQ[c.stage]; return q && c.lv >= q.lv && Object.entries(q.mats).every(([k, n]) => s.mats[k] >= n); })) return ['clouds', '진화할 수 있는 뭉게가 있어요', 'star'];
  if (s.exp.some((e) => !e)) return ['explore', '빈 열기구로 탐험 보내기', 'balloon'];
  const tp = TW.teamInfo(s, s.tower?.team || []).power, nf = (s.tower?.best || 0) + 1;
  if (tp >= TW.recommendedPower(nf) * 0.8) return ['tower', `하늘탑 ${nf}층에 도전해요`, 'tower'];
  return ['clouds', `팀 뭉게를 강화해 전투력을 올려요`, 'arrowUp'];
  return ['missions', '오늘의 미션 확인하기', 'mission'];
}

const inTeamOf = (id) => (G.store.view().tower?.team || []).indexOf(id);
// 뽑기 결과 안내: 역할·고유 능력·추천 콘텐츠·보유 뭉게와 비교·팀 편성 시 변화
function hatchInfo(id, isNew) {
  const s = G.store.view(); const c = s.clouds[id]; const sp = D.SPECIES[id]; const Rl = TW.ROLES[sp.el];
  const team = s.tower?.team || []; const before = TW.teamInfo(s, team).power;
  const cand = team.length < R.towerTeamMax(s) ? [...team, id] : (() => { const t = [...team]; let w = 1; for (let i = 2; i < t.length; i++) if (TW.cloudPower(s.clouds[t[i]], t[i]) < TW.cloudPower(s.clouds[t[w]], t[w])) w = i; if (t.length > 1) t[w] = id; return t; })();
  const after = inTeamOf(id) >= 0 ? before : TW.teamInfo(s, cand).power;
  const sameEl = Object.keys(s.clouds).filter((x) => x !== id && D.SPECIES[x].el === sp.el);
  const bestSame = sameEl.sort((a, b) => TW.cloudPower(s.clouds[b], b) - TW.cloudPower(s.clouds[a], a))[0];
  const newSyn = TW.teamInfo(s, cand).syn.filter((x) => !TW.teamInfo(s, team).syn.includes(x)).map((x) => TW.SYNERGIES.find((y) => y.id === x).name);
  return `<div class="hinfo"><div>${isNew ? esc(sp.desc) : `별 조각 +1 (${c.dupes}/${D.STAR_REQ[c.stars] || '-'}) · 별 승급하면 전투력 +20%`}</div>
    <div><b>고유 능력</b> ${Rl.passive}</div>
    <div><b>추천</b> 하늘탑 ${D.ELEMENTS[sp.el].name} 집이 많은 구간${sp.el === 'wind' || sp.el === 'snow' ? ' · 장애물이 많은 11층 이후' : sp.el === 'thunder' ? ' · 스킬을 자주 쓰는 보스 층' : ''}</div>
    <div><b>보유 비교</b> 전투력 ${TW.cloudPower(c, id).toLocaleString()}${!isNew ? (c.dupes >= (D.STAR_REQ[c.stars] || 99) ? ' · 지금 별 승급할 수 있어요!' : ' · 이미 함께하는 뭉게') : bestSame ? ` · 같은 ${D.ELEMENTS[sp.el].name} 최고 ${D.SPECIES[bestSame].names[s.clouds[bestSame].stage - 1]} ${TW.cloudPower(s.clouds[bestSame], bestSame).toLocaleString()}` : ` · 첫 ${D.ELEMENTS[sp.el].name} 뭉게!`}</div>
    ${inTeamOf(id) < 0 ? `<div><b>팀에 넣으면</b> 전투력 ${before.toLocaleString()} → ${after.toLocaleString()}${newSyn.length ? ` · 시너지 「${newSyn.join(', ')}」` : ''}</div>` : '<div><b>이미 하늘탑 팀에 있어요</b></div>'}</div>`;
}

};flows.hatch10 = async () => {
  const s = G.store.view();
  if (s.wallet.seed < D.HATCH_MULTI) { toast(`구름씨가 ${D.HATCH_MULTI}개 필요해요`); return; }
  let res;
  await modal({ body: `<div class="egg-stage shake"><div class="egg">${svgImg(seedSVG())}</div></div><p class="muted">구름씨 ${D.HATCH_MULTI}개가 한꺼번에 꿈틀거려요…</p>`, buttons: [], dismiss: false,
    onMount: async (w, close) => { G.sfx.crack(); G.haptic('wiggle'); const [r] = await Promise.all([G.store.act('hatch', { n: D.HATCH_MULTI }), new Promise((ok) => setTimeout(ok, G.prefs.quickHatch ? 120 : 1500))]); res = r; close(); } });
  if (!res?.ok) { toast(errMsg(res?.code || 'NETWORK')); return; }
  const list = res.r.results || [];
  // 높은 등급(에픽 이상)은 서버 확정 결과 중 가장 높은 것 1개만 전용 연출 후 전체 결과 화면
  const topR = Math.max(...list.map((x) => gradeRank(x.rarity)));
  const top = list.find((x) => gradeRank(x.rarity) === topR);
  if (top && topR >= gradeRank('epic')) await reveal(G, { ...top, stars: G.store.view().clouds[top.id]?.stars });
  else { G.sfx[topR >= gradeRank('rare') ? 'rare' : 'level'](); G.haptic('success'); }
  const v = G.store.view(); const seen = new Set();
  const cards = list.map((x) => {
    const first = x.isNew && !seen.has(x.id); seen.add(x.id); const c = v.clouds[x.id];
    return `<div class="hg g-${x.rarity}${gradeRank(x.rarity) === topR && topR >= gradeRank('epic') ? ' top' : ''}">${first ? '<span class="new">NEW</span>' : ''}${svgImg(cloudSVG(x.id, { stage: 1, mood: 'joy' }))}<span>${D.SPECIES[x.id].names[0]}</span>${gradeTag(x.rarity)}${first ? '' : `<span class="dup">별 조각 +1<br>${D.STAR_REQ[c.stars] == null ? '별 최대' : c.dupes >= D.STAR_REQ[c.stars] ? '<b>승급 가능!</b>' : `${c.dupes}/${D.STAR_REQ[c.stars]}`}</span>`}</div>`;
  }).join('');
  const newIds = [...new Set(list.filter((x) => x.isNew).map((x) => x.id))];
  const team = v.tower?.team || [];
  const bestNew = newIds.filter((id) => inTeamOf(id) < 0).sort((a, b) => TW.cloudPower(v.clouds[b], b) - TW.cloudPower(v.clouds[a], a))[0];
  const teamFx = bestNew ? (() => { const before = TW.teamInfo(v, team).power; const t = [...team]; if (t.length < R.towerTeamMax(v)) t.push(bestNew); else { let w = 1; for (let i = 2; i < t.length; i++) if (TW.cloudPower(v.clouds[t[i]], t[i]) < TW.cloudPower(v.clouds[t[w]], t[w])) w = i; if (t.length > 1) t[w] = bestNew; } const after = TW.teamInfo(v, t).power; const syn = TW.teamInfo(v, t).syn.filter((x) => !TW.teamInfo(v, team).syn.includes(x)).map((x) => TW.SYNERGIES.find((y) => y.id === x).name); return after > before ? `<p class="muted"><b>${D.SPECIES[bestNew].names[0]}</b> 편성 시 하늘탑 전투력 ${before.toLocaleString()} → <b>${after.toLocaleString()}</b>${syn.length ? ` · 시너지 「${syn.join(', ')}」` : ''}</p>` : `<p class="muted"><b>${D.SPECIES[bestNew].names[0]}</b>는 아직 지금 팀보다 약해요. 레벨업하면 전투력 ${TW.cloudPower(v.clouds[bestNew], bestNew).toLocaleString()}에서 오르고${syn.length ? `, 편성하면 시너지 「${syn.join(', ')}」가 켜져요` : ' 능력도 커져요'}.</p>`; })() : '';
  const canAgain = v.wallet.seed >= D.HATCH_MULTI;
  const choice = await modal({ title: `${D.HATCH_MULTI}회 부화 결과`,
    body: `<div class="hatch-grid">${cards}</div><p class="muted">새 뭉게 ${newIds.length}종 · 중복 ${list.length - list.filter((x, i) => x.isNew && list.findIndex((y) => y.id === x.id) === i).length}마리(별 승급 재료로 쌓여요)</p>${teamFx}${pityLine()}`,
    buttons: [{ label: '목장으로', cls: 'paper', value: 'home' }, ...(bestNew ? [{ label: '새 뭉게 편성', cls: 'sky', value: 'team' }] : []), { label: canAgain ? '다시 10회' : '구름씨 부족', cls: 'coral', value: 'again', disabled: !canAgain }],
  });
  G.sheets.render(true);
  if (choice === 'again') flows.hatch10(); else if (choice === 'team' && bestNew) { await flows.addToTeam(bestNew); G.sheets.open('tower'); }
};

    const un = (o.unlocks || []).map((u) => `<div class="unlock">${img('lock')} <b>${u.name}</b> 해금 · ${u.desc}</div>`).join('');
    const sp = o.species ? `<div class="unlock">${svgImg(cloudSVG(o.species.id, { stage: 1, mood: 'joy' }))}<b>${D.SPECIES[o.species.id].names[0]}</b> ${o.species.isNew ? '합류!' : '별 조각 +1'}</div>` : '';
    const vu = (o.villageUps || []).length ? `<p class="muted">마을 Lv ${o.villageUps[o.villageUps.length - 1]} 달성!</p>` : '';
    const nextRec = TW.recommendedPower(nf); const tp = TW.teamInfo(s, s.tower.team).power;
    const B = TW.bossOf(o.f);
    // 달빛 하늘탑의 비밀 발견 (서버 판정) → 히든 전용 연출
    if (o.hidden) await reveal(G, { id: o.hidden.id, rarity: D.SPECIES[o.hidden.id].rarity, isNew: o.hidden.isNew, dupes: s.clouds[o.hidden.id]?.dupes, stars: s.clouds[o.hidden.id]?.stars });
    if (o.milestone) { G.sfx.fanfare(); G.haptic('confetti'); }
    const extra = `${o.milestone ? `<div class="unlock ms">${img('trophy')} <b>${o.milestone.f}층 달성 보상!</b> ${rewardChips(o.milestone.reward)}</div>` : ''}${o.candy ? `<div class="unlock">${img('candy')} 할로윈 ${R.eventCfg().candy} +${o.candy}</div>` : ''}${o.hidden ? `<div class="unlock">${gradeTag('hidden')} <b>${D.SPECIES[o.hidden.id].names[0]}</b> ${o.hidden.isNew ? '발견!' : '별 조각 +1'}</div>` : ''}${o.weeklyWin ? '<small class="muted">주간 하늘탑 성공 +1</small>' : ''}`;
    const autoNext = G.prefs.autoNext && o.newBest && !o.milestone && !o.hidden;
    const v = await modal({
      burst: o.newBest, title: o.newBest ? (B ? `보스 「${B.name}」 처치!` : `${o.f}층 돌파!`) : `${o.f}층 반복 완료`,
      onMount: autoNext ? (w, close) => { let n = 3; const b = w.querySelector('.btns .btn.coral'); const tick = () => { if (!w.isConnected) return; if (n <= 0) return close('next'); if (b) b.textContent = `${nf}층 자동 도전 ${n}`; n--; setTimeout(tick, 1000); }; tick(); const stop = document.createElement('button'); stop.className = 'linkish'; stop.textContent = '자동 도전 멈추기'; stop.onclick = () => { G.setPref('autoNext', false); close('stay'); }; w.querySelector('.modal').appendChild(stop); } : undefined,
      body: `<div class="t-stars">${stars}</div><p class="muted">만족도 ${pct}% · 점수 ${o.score.toLocaleString()} · 최고 콤보 ${o.maxCombo}</p>${rewardChips(o.reward)}${sp}${un}${vu}${extra}
        <div class="sec" style="text-align:left">뭉게별 기여도</div><div class="contrib">${contrib}</div>
        <div class="next-goal">다음 목표 <b>${nf}층</b> · 권장 전투력 ${nextRec.toLocaleString()} (현재 ${tp.toLocaleString()})</div>`,
      buttons: [{ label: '목장으로', cls: 'paper', value: 'home' }, o.repeat ? { label: `다시 반복 ${img('wind')}${s.wind.n}`, cls: 'mint', value: 'again', disabled: s.wind.n < 1 } : { label: `${nf}층 도전`, cls: 'coral', value: 'next' }], dismiss: false,
    });
    if (v === 'next') flows.tower(nf, { keepMode: true }); else if (v === 'again') flows.tower(o.f, { keepMode: true });
  } else {
    const adv = TW.advise(sim, team, o.f);
    const v = await modal({
      title: `${o.f}층 도전 실패`, art: `<div class="art" style="height:100px">${svgImg(cloudSVG(run.team[0], { stage: s.clouds[run.team[0]]?.stage || 1, mood: 'dizzy' }))}</div>`,
      body: `<p class="muted">만족도 ${pct}% / 필요 70%${sim.hp <= 0 ? ' · 체력이 바닥났어요' : ''}${o.repeat ? ' · 바람병은 돌려받았어요' : ''}</p>
        <div class="advice">${adv.map((a) => `<div>${img(a.k === 'shield' ? 'shield' : a.k === 'upgrade' ? 'arrowUp' : a.k === 'skill' ? 'star' : 'cloud')} ${esc(a.text)}</div>`).join('') || '<div>조금만 더 하면 돼요! 다시 도전해 보세요.</div>'}</div>
        <div class="sec" style="text-align:left">뭉게별 기여도</div><div class="contrib">${contrib}</div>`,
      buttons: [{ label: '팀 변경', cls: 'paper', value: 'team' }, { label: '강화하러 가기', cls: 'paper', value: 'up' }, { label: '다시 도전', cls: 'coral', value: 'retry' }], dismiss: false,
    });
    if (v === 'retry') flows.tower(o.f, { keepMode: true }); else if (v === 'team') G.sheets.open('tower'); else if (v === 'up') G.sheets.open('clouds');
  }
};
boot();

Object.assign(__e,{});})();
})();</script>
</body>
</html>
